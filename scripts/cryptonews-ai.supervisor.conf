; Install only after replacing the project path, PHP path and Unix account.
; This program is isolated from workers for every other application.
[program:cryptonews-ai]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/cryptonews/current
command=/usr/bin/php8.4 /var/www/cryptonews/current/artisan queue:work database --queue=ai --sleep=3 --tries=1 --timeout=75 --max-time=3600 --memory=256 --no-interaction
user=www-data
numprocs=1
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/cryptonews/current/storage/logs/ai-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
umask=0027
